<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Source Han Sans CN", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .ink { fill: #3D3833; }
      .ink-soft { fill: #5C5650; }
      .ink-mute { fill: #8E887F; }
      .accent { fill: #C96442; }
      .label { letter-spacing: 2.5px; font-weight: 700; }
    </style>
    <filter id="soft" x="-3%" y="-3%" width="106%" height="106%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#F5F4ED"/>

  <!-- ============= HEADER ============= -->
  <text x="35" y="42" font-size="14" class="ink-mute label">CPA · 会计 · 逻辑重构 100 关  /  ASSET 03</text>
  <text x="35" y="92" font-size="42" font-weight="700" class="ink">第 3 关 · 后续计量与终止确认</text>
  <text x="35" y="122" font-size="18" class="ink-soft">存货  ·  固定资产  ·  无形资产  ·  完整生命周期</text>
  <rect x="35" y="138" width="64" height="3.5" rx="1.5" fill="#C96442"/>

  <!-- top right thesis -->
  <rect x="880" y="22" width="685" height="124" rx="14" fill="#3D3833"/>
  <text x="906" y="54" font-size="13" letter-spacing="3" font-weight="700" fill="#C96442">THESIS</text>
  <text x="906" y="85" font-size="22" font-weight="700" fill="#F5F4ED">流动性  ▶  价值观察的客观程度  ▶  处理逻辑</text>
  <text x="906" y="112" font-size="14" fill="#C7C0B5">流动资产 通过"卖出"实现价值  ·  非流动资产 通过"使用"实现价值</text>
  <text x="906" y="134" font-size="14" fill="#A8A095">这条主线  ·  贯穿折旧摊销的有无 + 减值能否转回</text>

  <!-- ============= 三列资产生命周期 ============= -->
  <!-- col positions: 35 / 555 / 1075, w=490 each -->

  <!-- col 1 header bar 存货 -->
  <rect x="35" y="170" width="490" height="58" rx="12" fill="#3D3833"/>
  <text x="55" y="196" font-size="13" letter-spacing="2.5" font-weight="700" fill="#C96442">INVENTORY · 流动资产</text>
  <text x="55" y="220" font-size="22" font-weight="700" fill="#F5F4ED">存货  ·  价值通过卖出实现</text>

  <!-- col 2 header bar 固定资产 -->
  <rect x="555" y="170" width="490" height="58" rx="12" fill="#3D3833"/>
  <text x="575" y="196" font-size="13" letter-spacing="2.5" font-weight="700" fill="#C96442">PP&amp;E · 非流动</text>
  <text x="575" y="220" font-size="22" font-weight="700" fill="#F5F4ED">固定资产  ·  价值通过使用渐进消耗</text>

  <!-- col 3 header bar 无形资产 -->
  <rect x="1075" y="170" width="490" height="58" rx="12" fill="#3D3833"/>
  <text x="1095" y="196" font-size="13" letter-spacing="2.5" font-weight="700" fill="#C96442">INTANGIBLE · 非流动</text>
  <text x="1095" y="220" font-size="22" font-weight="700" fill="#F5F4ED">无形资产  ·  价值通过使用渐进消耗</text>

  <!-- ============= 子卡片 · 三阶段 ============= -->
  <!-- y: 240-393 (153) / 397-550 (153) / 554-707 (153) -->

  <g filter="url(#soft)">
    <!-- col 1 -->
    <rect x="35"   y="240" width="490" height="153" rx="12" fill="#FFFFFF"/>
    <rect x="35"   y="397" width="490" height="153" rx="12" fill="#FFFFFF"/>
    <rect x="35"   y="554" width="490" height="153" rx="12" fill="#FFFFFF"/>
    <!-- col 2 -->
    <rect x="555"  y="240" width="490" height="153" rx="12" fill="#FFFFFF"/>
    <rect x="555"  y="397" width="490" height="153" rx="12" fill="#FFFFFF"/>
    <rect x="555"  y="554" width="490" height="153" rx="12" fill="#FFFFFF"/>
    <!-- col 3 -->
    <rect x="1075" y="240" width="490" height="153" rx="12" fill="#FFFFFF"/>
    <rect x="1075" y="397" width="490" height="153" rx="12" fill="#FFFFFF"/>
    <rect x="1075" y="554" width="490" height="153" rx="12" fill="#FFFFFF"/>
  </g>

  <!-- ===== 存货 sub 1 · 期末计量 ===== -->
  <circle cx="65" cy="270" r="16" fill="#C96442"/>
  <text x="65" y="276" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">①</text>
  <text x="92" y="266" font-size="13" letter-spacing="2" font-weight="700" class="accent">期末计量</text>
  <text x="92" y="292" font-size="20" font-weight="700" class="ink">成本与可变现净值孰低</text>
  <line x1="55" y1="306" x2="505" y2="306" stroke="#EAE7DD"/>
  <text x="55" y="330" font-size="15" class="ink-soft">直接出售  ·  估计售价 − 销售费用 − 税费</text>
  <text x="55" y="354" font-size="15" class="ink-soft">需加工材料  ·  看终端产品是否减值</text>
  <text x="55" y="380" font-size="14" class="ink-mute">账面 &gt; 可变现净值  →  计提存货跌价准备</text>

  <!-- ===== 存货 sub 2 · 跌价转回 ===== -->
  <circle cx="65" cy="427" r="16" fill="#C96442" fill-opacity="0.85"/>
  <text x="65" y="433" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">②</text>
  <text x="92" y="423" font-size="13" letter-spacing="2" font-weight="700" class="accent">减值处理</text>
  <text x="92" y="449" font-size="20" font-weight="700" class="ink">跌价准备  ✓  允许转回</text>
  <line x1="55" y1="463" x2="505" y2="463" stroke="#EAE7DD"/>
  <text x="55" y="487" font-size="15" class="ink-soft">流动性强  ·  市场可观察客观市价</text>
  <text x="55" y="511" font-size="15" class="ink-soft">市价跌如实记，市价回如实复</text>
  <text x="55" y="537" font-size="14" class="ink-mute">上限  ·  转回后不得高于原历史成本</text>

  <!-- ===== 存货 sub 3 · 终止确认 ===== -->
  <circle cx="65" cy="584" r="16" fill="#C96442" fill-opacity="0.7"/>
  <text x="65" y="590" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">③</text>
  <text x="92" y="580" font-size="13" letter-spacing="2" font-weight="700" class="accent">终止确认</text>
  <text x="92" y="606" font-size="20" font-weight="700" class="ink">卖出时按成本结转</text>
  <line x1="55" y1="620" x2="505" y2="620" stroke="#EAE7DD"/>
  <text x="55" y="644" font-size="15" class="ink-soft">借  主营业务成本 + 存货跌价准备</text>
  <text x="55" y="668" font-size="15" class="ink-soft">贷  库存商品 / 原材料</text>
  <text x="55" y="694" font-size="14" class="ink-mute">发出方法  ·  先进先出 / 加权平均 / 个别计价</text>

  <!-- ===== 固资 sub 1 · 折旧 ===== -->
  <circle cx="585" cy="270" r="16" fill="#C96442"/>
  <text x="585" y="276" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">①</text>
  <text x="612" y="266" font-size="13" letter-spacing="2" font-weight="700" class="accent">折旧</text>
  <text x="612" y="292" font-size="20" font-weight="700" class="ink">价值消耗的会计模拟</text>
  <line x1="575" y1="306" x2="1025" y2="306" stroke="#EAE7DD"/>
  <text x="575" y="330" font-size="14" class="ink-soft"><tspan font-weight="700" class="ink">三要素</tspan>  ·  折旧基数  ·  折旧年限  ·  折旧方法</text>
  <text x="575" y="354" font-size="14" class="ink-soft"><tspan font-weight="700" class="ink">四方法</tspan>  ·  直线  /  工作量  /  双倍余额递减  /  年数总和</text>
  <text x="575" y="380" font-size="13" class="ink-mute">加速法（双倍 · 年数）前期多后期少  ·  双倍法前期不扣净残值</text>

  <!-- ===== 固资 sub 2 · 减值 ===== -->
  <circle cx="585" cy="427" r="16" fill="#C96442" fill-opacity="0.85"/>
  <text x="585" y="433" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">②</text>
  <text x="612" y="423" font-size="13" letter-spacing="2" font-weight="700" class="accent">减值</text>
  <text x="612" y="449" font-size="20" font-weight="700" class="ink">减值准备  ✗  不可转回</text>
  <line x1="575" y1="463" x2="1025" y2="463" stroke="#EAE7DD"/>
  <text x="575" y="487" font-size="14" class="ink-soft">可收回金额  =  Max（公允价值 − 处置费用，使用价值）</text>
  <text x="575" y="511" font-size="14" class="ink-soft">流动性差  ·  无活跃市场  ·  依赖主观估计</text>
  <text x="575" y="537" font-size="13" class="ink-mute">不可逆 = 杜绝企业操纵计提与转回调节利润</text>

  <!-- ===== 固资 sub 3 · 后续支出+处置 ===== -->
  <circle cx="585" cy="584" r="16" fill="#C96442" fill-opacity="0.7"/>
  <text x="585" y="590" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">③</text>
  <text x="612" y="580" font-size="13" letter-spacing="2" font-weight="700" class="accent">后续支出  +  处置</text>
  <text x="612" y="606" font-size="20" font-weight="700" class="ink">资本化与终止</text>
  <line x1="575" y1="620" x2="1025" y2="620" stroke="#EAE7DD"/>
  <text x="575" y="644" font-size="14" class="ink-soft"><tspan font-weight="700" class="ink">资本化</tspan>  ·  扣除被替换部分账面价值后入新资产</text>
  <text x="575" y="668" font-size="14" class="ink-soft"><tspan font-weight="700" class="ink">出售</tspan>  →  资产处置损益　　<tspan font-weight="700" class="ink">报废</tspan>  →  营业外收支</text>
  <text x="575" y="694" font-size="13" class="ink-mute">通过"固定资产清理"科目归集  ·  累计折旧/减值同步结转</text>

  <!-- ===== 无形 sub 1 · 摊销 ===== -->
  <circle cx="1105" cy="270" r="16" fill="#C96442"/>
  <text x="1105" y="276" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">①</text>
  <text x="1132" y="266" font-size="13" letter-spacing="2" font-weight="700" class="accent">摊销</text>
  <text x="1132" y="292" font-size="20" font-weight="700" class="ink">看使用寿命做不做摊销</text>
  <line x1="1095" y1="306" x2="1545" y2="306" stroke="#EAE7DD"/>
  <text x="1095" y="330" font-size="15" class="ink-soft"><tspan font-weight="700" class="ink">有限寿命</tspan>  →  直线法摊销  ·  残值通常为零</text>
  <text x="1095" y="354" font-size="15" class="ink-soft"><tspan font-weight="700" class="ink">不确定寿命</tspan>  →  不摊销，每年减值测试</text>
  <text x="1095" y="380" font-size="13" class="ink-mute">期限取小者  ·  法定 / 经济利益 / 管理层使用计划</text>

  <!-- ===== 无形 sub 2 · 减值 ===== -->
  <circle cx="1105" cy="427" r="16" fill="#C96442" fill-opacity="0.85"/>
  <text x="1105" y="433" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">②</text>
  <text x="1132" y="423" font-size="13" letter-spacing="2" font-weight="700" class="accent">减值</text>
  <text x="1132" y="449" font-size="20" font-weight="700" class="ink">减值准备  ✗  不可转回</text>
  <line x1="1095" y1="463" x2="1545" y2="463" stroke="#EAE7DD"/>
  <text x="1095" y="487" font-size="15" class="ink-soft">逻辑同固定资产  ·  账面 &gt; 可收回 → 减值</text>
  <text x="1095" y="511" font-size="15" class="ink-soft">流动性更差  ·  专利商标著作权无活跃市场</text>
  <text x="1095" y="537" font-size="13" class="ink-mute">不可转回是对"可靠性"的最后保护</text>

  <!-- ===== 无形 sub 3 · 处置 ===== -->
  <circle cx="1105" cy="584" r="16" fill="#C96442" fill-opacity="0.7"/>
  <text x="1105" y="590" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">③</text>
  <text x="1132" y="580" font-size="13" letter-spacing="2" font-weight="700" class="accent">终止确认</text>
  <text x="1132" y="606" font-size="20" font-weight="700" class="ink">出售或报废</text>
  <line x1="1095" y1="620" x2="1545" y2="620" stroke="#EAE7DD"/>
  <text x="1095" y="644" font-size="14" class="ink-soft"><tspan font-weight="700" class="ink">出售</tspan>  →  资产处置损益（差额）</text>
  <text x="1095" y="668" font-size="14" class="ink-soft"><tspan font-weight="700" class="ink">报废</tspan>  →  营业外支出（按账面价值）</text>
  <text x="1095" y="694" font-size="13" class="ink-mute">累计摊销 + 减值准备同步结转清零</text>

  <!-- ============= BOTTOM · 三大减值准则差异 ============= -->
  <text x="35" y="746" font-size="13" class="accent label">FINALE  /  三大减值准则差异 · IMPAIRMENT FRAMEWORK</text>

  <!-- 3 rule cards -->
  <g filter="url(#soft)">
    <rect x="35"   y="760" width="500" height="118" rx="12" fill="#FFFFFF"/>
    <rect x="555"  y="760" width="500" height="118" rx="12" fill="#FFFFFF"/>
    <rect x="1075" y="760" width="500" height="118" rx="12" fill="#FFFFFF"/>
  </g>

  <!-- rule 1 存货准则 -->
  <rect x="35" y="760" width="500" height="34" rx="12" fill="#EDE8DD"/>
  <rect x="35" y="780" width="500" height="14" fill="#EDE8DD"/>
  <text x="55" y="784" font-size="16" font-weight="700" class="ink">存货准则  ·  <tspan class="accent">可以转回</tspan></text>
  <text x="55" y="826" font-size="14" class="ink-soft">减值依据 = 可变现净值  =  市场价格</text>
  <text x="55" y="850" font-size="14" class="ink-mute">客观可观察  →  市价回升如实恢复账面价值</text>
  <text x="55" y="872" font-size="13" class="ink-mute">观察到客观价值  →  允许转回</text>

  <!-- rule 2 资产减值准则 -->
  <rect x="555" y="760" width="500" height="34" rx="12" fill="#EDE8DD"/>
  <rect x="555" y="780" width="500" height="14" fill="#EDE8DD"/>
  <text x="575" y="784" font-size="16" font-weight="700" class="ink">资产减值准则  ·  <tspan class="accent">不可转回</tspan></text>
  <text x="575" y="826" font-size="14" class="ink-soft">固资 / 无形 / 长期股权投资</text>
  <text x="575" y="850" font-size="14" class="ink-mute">可收回金额 = 估算未来现金流 + 折现率</text>
  <text x="575" y="872" font-size="13" class="ink-mute">依赖主观估计  →  用不可逆换可信度</text>

  <!-- rule 3 金融工具准则 -->
  <rect x="1075" y="760" width="500" height="34" rx="12" fill="#EDE8DD"/>
  <rect x="1075" y="780" width="500" height="14" fill="#EDE8DD"/>
  <text x="1095" y="784" font-size="16" font-weight="700" class="ink">金融工具准则  ·  <tspan class="accent">必须转回</tspan></text>
  <text x="1095" y="826" font-size="14" class="ink-soft">摊余成本 / FVOCI 债务工具</text>
  <text x="1095" y="850" font-size="14" class="ink-mute">预期信用损失模型  ·  风险升提风险降冲</text>
  <text x="1095" y="872" font-size="13" class="ink-mute">动态模型驱动  →  必须转回是模型内在要求</text>

</svg>
