<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Source Han Sans CN", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .ink { fill: #1F1E1B; }
      .ink-soft { fill: #4A4842; }
      .ink-mute { fill: #93918A; }
      .accent { fill: #C96442; }
      .label { letter-spacing: 2.5px; font-weight: 700; }
    </style>
    <filter id="soft" x="-3%" y="-3%" width="106%" height="106%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#F5F4ED"/>

  <!-- ============= HEADER ============= -->
  <text x="50" y="52" font-size="11" class="ink-mute label">CPA · 会计 · 逻辑重构 100 关  /  ASSET 01</text>
  <text x="50" y="100" font-size="36" font-weight="700" class="ink">第 1 关 · 资产的本质、确认与计量</text>
  <text x="50" y="128" font-size="15" class="ink-soft">它是什么  ·  什么时候确认  ·  记多少钱</text>
  <rect x="50" y="146" width="48" height="3" rx="1.5" fill="#C96442"/>

  <!-- top right: definition -->
  <rect x="900" y="40" width="650" height="110" rx="12" fill="#1F1E1B"/>
  <text x="924" y="68" font-size="10" letter-spacing="3" font-weight="700" fill="#C96442">DEFINITION</text>
  <text x="924" y="92" font-size="13" fill="#F5F4ED">资产是企业过去的交易或事项形成的，由企业拥有或控制的，</text>
  <text x="924" y="112" font-size="13" fill="#F5F4ED">预期会给企业带来经济利益的资源</text>
  <text x="924" y="136" font-size="11" fill="#93918A">本质 = 一台现金流机器里所有能产生现金流的零件之和</text>

  <!-- ============= 3 COLUMNS ============= -->
  <!-- col1: 50-510 / col2: 530-990 / col3: 1010-1550, gap 20 -->

  <!-- ============= COL 1 · 本质 ============= -->
  <text x="50" y="200" font-size="11" class="accent label">01  /  本质 · ESSENCE</text>
  <text x="50" y="228" font-size="22" font-weight="700" class="ink">三重过滤器</text>
  <text x="50" y="250" font-size="12" class="ink-soft">价值 · 归属 · 时态，缺一不可</text>

  <!-- card 价值 -->
  <g filter="url(#soft)"><rect x="50" y="266" width="460" height="100" rx="10" fill="#FFFFFF"/></g>
  <circle cx="78" cy="294" r="13" fill="#C96442"/>
  <text x="78" y="299" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">③</text>
  <text x="105" y="290" font-size="16" font-weight="700" class="ink">价值  ·  能给企业带来经济利益吗</text>
  <text x="105" y="312" font-size="11" class="ink-soft">资产本质不是"我有什么"，而是"我能用什么赚钱"</text>
  <line x1="105" y1="324" x2="125" y2="324" stroke="#E5E2D9"/>
  <text x="105" y="346" font-size="10" class="ink-mute">反例 · 报废的机器虽在名下，但已不是资产 → 该减值减值，该报废报废</text>

  <!-- card 归属 -->
  <g filter="url(#soft)"><rect x="50" y="378" width="460" height="100" rx="10" fill="#FFFFFF"/></g>
  <circle cx="78" cy="406" r="13" fill="#C96442" fill-opacity="0.85"/>
  <text x="78" y="411" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">②</text>
  <text x="105" y="402" font-size="16" font-weight="700" class="ink">归属  ·  企业拥有或控制吗</text>
  <text x="105" y="424" font-size="11" class="ink-soft">控制权  &gt;  所有权（实质重于形式）</text>
  <line x1="105" y1="436" x2="125" y2="436" stroke="#E5E2D9"/>
  <text x="105" y="458" font-size="10" class="ink-mute">案例 · 融资租入设备：法律所有权在出租方，但风险/收益在你 → 是你的资产</text>

  <!-- card 时态 -->
  <g filter="url(#soft)"><rect x="50" y="490" width="460" height="100" rx="10" fill="#FFFFFF"/></g>
  <circle cx="78" cy="518" r="13" fill="#C96442" fill-opacity="0.7"/>
  <text x="78" y="523" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">①</text>
  <text x="105" y="514" font-size="16" font-weight="700" class="ink">时态  ·  过去的交易或事项形成的吗</text>
  <text x="105" y="536" font-size="11" class="ink-soft">划一条时间线，未来的、计划中的、承诺的都不算</text>
  <line x1="105" y1="548" x2="125" y2="548" stroke="#E5E2D9"/>
  <text x="105" y="570" font-size="10" class="ink-mute">非资产 · 董事会决议明年投资  ·  签署收购意向书  ·  已申请未使用的银行授信</text>

  <!-- 本质小结 -->
  <rect x="50" y="606" width="460" height="62" rx="10" fill="#EDE8DD"/>
  <text x="68" y="630" font-size="11" letter-spacing="2" font-weight="700" class="accent">PRINCIPLE</text>
  <text x="68" y="652" font-size="13" class="ink">三重过滤器三个维度  ·  价值（值不值）·  归属（你的吗）·  时态（发生了吗）</text>

  <!-- ============= COL 2 · 确认 ============= -->
  <text x="530" y="200" font-size="11" class="accent label">02  /  确认 · RECOGNITION</text>
  <text x="530" y="228" font-size="22" font-weight="700" class="ink">花了钱，不一定是资产</text>
  <text x="530" y="250" font-size="12" class="ink-soft">两个条件必须同时满足</text>

  <!-- 确认条件1 -->
  <g filter="url(#soft)"><rect x="530" y="266" width="460" height="120" rx="10" fill="#FFFFFF"/></g>
  <text x="550" y="294" font-size="10" letter-spacing="2" font-weight="700" class="accent">CONDITION ①</text>
  <text x="550" y="320" font-size="16" font-weight="700" class="ink">经济利益很可能流入企业</text>
  <line x1="550" y1="332" x2="970" y2="332" stroke="#EAE7DD"/>
  <text x="550" y="352" font-size="11" class="ink-soft">反例  ·  胜诉概率很高的索赔 500 万  →  不能确认，只能附注披露</text>
  <text x="550" y="372" font-size="10" class="ink-mute">资产/负债不对称  ·  负债"很可能"就确认，资产门槛更高 → 谨慎性</text>

  <!-- 确认条件2 -->
  <g filter="url(#soft)"><rect x="530" y="398" width="460" height="120" rx="10" fill="#FFFFFF"/></g>
  <text x="550" y="426" font-size="10" letter-spacing="2" font-weight="700" class="accent">CONDITION ②</text>
  <text x="550" y="452" font-size="16" font-weight="700" class="ink">成本/价值能够可靠计量</text>
  <line x1="550" y1="464" x2="970" y2="464" stroke="#EAE7DD"/>
  <text x="550" y="484" font-size="11" class="ink-soft">反例  ·  自创品牌投放 5000 万广告  →  全部费用化</text>
  <text x="550" y="504" font-size="10" class="ink-mute">买来的品牌可入表，自做大的不能  ·  只有交易能给无形之物一个可靠的锚</text>

  <!-- 成本边界 -->
  <text x="530" y="552" font-size="11" class="accent label">+  COST BOUNDARY  ·  历史成本下，什么能进资产</text>
  <g filter="url(#soft)"><rect x="530" y="566" width="460" height="102" rx="10" fill="#FFFFFF"/></g>
  <text x="550" y="592" font-size="13" font-weight="700" class="ink">两个关键词  ·  直接归属  +  必要</text>
  <line x1="550" y1="602" x2="970" y2="602" stroke="#EAE7DD"/>
  <text x="550" y="622" font-size="11" class="ink-soft">差旅费 ✗  ·  采购员出差不能精确切割到某批资产，也非"让它能用"的必要支出</text>
  <text x="550" y="642" font-size="11" class="ink-soft">专项借款利息 ✓  ·  达到预定可使用状态前资本化，之后费用化</text>
  <text x="550" y="660" font-size="10" class="ink-mute">边界 = 让它能用的直接代价，而非整个采购过程的全部花费</text>

  <!-- ============= COL 3 · 计量 ============= -->
  <text x="1010" y="200" font-size="11" class="accent label">03  /  计量 · MEASUREMENT</text>
  <text x="1010" y="228" font-size="22" font-weight="700" class="ink">五把尺子，一道平衡题</text>
  <text x="1010" y="250" font-size="12" class="ink-soft">可靠性  ⇄  相关性</text>

  <!-- 5 measurement rows -->
  <g filter="url(#soft)"><rect x="1010" y="266" width="540" height="402" rx="10" fill="#FFFFFF"/></g>

  <!-- header row -->
  <text x="1030" y="290" font-size="9" letter-spacing="2" class="ink-mute">#</text>
  <text x="1080" y="290" font-size="9" letter-spacing="2" class="ink-mute">尺  子</text>
  <text x="1230" y="290" font-size="9" letter-spacing="2" class="ink-mute">本  质</text>
  <text x="1430" y="290" font-size="9" letter-spacing="2" class="ink-mute">典型场景</text>
  <line x1="1030" y1="300" x2="1530" y2="300" stroke="#EAE7DD"/>

  <!-- row 1: 历史成本 -->
  <circle cx="1042" cy="324" r="11" fill="#C96442"/>
  <text x="1042" y="328" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="1080" y="320" font-size="14" font-weight="700" class="ink">历史成本</text>
  <text x="1080" y="338" font-size="10" class="ink-mute">最可靠 · 客观可验证</text>
  <text x="1230" y="320" font-size="11" class="ink-soft">取得时实际发生的成本</text>
  <text x="1230" y="338" font-size="10" class="ink-mute">不随市场调整</text>
  <text x="1430" y="320" font-size="11" class="ink-soft">存货 / 固资 / 无形</text>
  <text x="1430" y="338" font-size="10" class="ink-mute">初始入账主流</text>
  <line x1="1030" y1="354" x2="1530" y2="354" stroke="#EAE7DD" stroke-dasharray="2 3"/>

  <!-- row 2: 重置成本 -->
  <circle cx="1042" cy="378" r="11" fill="#C96442" fill-opacity="0.85"/>
  <text x="1042" y="382" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="1080" y="374" font-size="14" font-weight="700" class="ink">重置成本</text>
  <text x="1080" y="392" font-size="10" class="ink-mute">追溯不到时的替代</text>
  <text x="1230" y="374" font-size="11" class="ink-soft">现在重新取得的成本</text>
  <text x="1230" y="392" font-size="10" class="ink-mute">倒推法</text>
  <text x="1430" y="374" font-size="11" class="ink-soft">固定资产盘盈</text>
  <text x="1430" y="392" font-size="10" class="ink-mute">无原始凭证</text>
  <line x1="1030" y1="408" x2="1530" y2="408" stroke="#EAE7DD" stroke-dasharray="2 3"/>

  <!-- row 3: 可变现净值 -->
  <circle cx="1042" cy="432" r="11" fill="#C96442" fill-opacity="0.7"/>
  <text x="1042" y="436" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="1080" y="428" font-size="14" font-weight="700" class="ink">可变现净值</text>
  <text x="1080" y="446" font-size="10" class="ink-mute">谨慎性原则的落地</text>
  <text x="1230" y="428" font-size="11" class="ink-soft">售价 − 完工 − 销售费</text>
  <text x="1230" y="446" font-size="10" class="ink-mute">历史成本的上限约束</text>
  <text x="1430" y="428" font-size="11" class="ink-soft">存货减值测试</text>
  <text x="1430" y="446" font-size="10" class="ink-mute">不得虚增</text>
  <line x1="1030" y1="462" x2="1530" y2="462" stroke="#EAE7DD" stroke-dasharray="2 3"/>

  <!-- row 4: 现值 -->
  <circle cx="1042" cy="486" r="11" fill="#C96442" fill-opacity="0.55"/>
  <text x="1042" y="490" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1080" y="482" font-size="14" font-weight="700" class="ink">现值</text>
  <text x="1080" y="500" font-size="10" class="ink-mute">解决时间问题</text>
  <text x="1230" y="482" font-size="11" class="ink-soft">未来现金流折现到今天</text>
  <text x="1230" y="500" font-size="10" class="ink-mute">货币时间价值</text>
  <text x="1430" y="482" font-size="11" class="ink-soft">长期应收款</text>
  <text x="1430" y="500" font-size="10" class="ink-mute">融资成分销售</text>
  <line x1="1030" y1="516" x2="1530" y2="516" stroke="#EAE7DD" stroke-dasharray="2 3"/>

  <!-- row 5: 公允价值 -->
  <circle cx="1042" cy="540" r="11" fill="#C96442" fill-opacity="0.4"/>
  <text x="1042" y="544" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="1080" y="536" font-size="14" font-weight="700" class="ink">公允价值</text>
  <text x="1080" y="554" font-size="10" class="ink-mute">最相关 · 但有判断</text>
  <text x="1230" y="536" font-size="11" class="ink-soft">市场参与者有序交易价</text>
  <text x="1230" y="554" font-size="10" class="ink-mute">"现在这一刻的真相"</text>
  <text x="1430" y="536" font-size="11" class="ink-soft">交易性金融资产</text>
  <text x="1430" y="554" font-size="10" class="ink-mute">每日重新计量</text>

  <!-- 公允价值三层次 -->
  <line x1="1030" y1="578" x2="1530" y2="578" stroke="#EAE7DD"/>
  <text x="1030" y="600" font-size="10" letter-spacing="2" font-weight="700" class="accent">FAIR VALUE HIERARCHY  ·  优先用低层次输入值</text>

  <rect x="1030" y="612" width="160" height="46" rx="6" fill="#1F1E1B"/>
  <text x="1043" y="630" font-size="10" font-weight="700" fill="#C96442">LEVEL 1</text>
  <text x="1043" y="648" font-size="10" fill="#F5F4ED">活跃市场报价 · 上市股票</text>

  <rect x="1200" y="612" width="160" height="46" rx="6" fill="#3A3733"/>
  <text x="1213" y="630" font-size="10" font-weight="700" fill="#C96442">LEVEL 2</text>
  <text x="1213" y="648" font-size="10" fill="#F5F4ED">类似资产数据 · 估值倍数</text>

  <rect x="1370" y="612" width="160" height="46" rx="6" fill="#5C5852"/>
  <text x="1383" y="630" font-size="10" font-weight="700" fill="#C96442">LEVEL 3</text>
  <text x="1383" y="648" font-size="10" fill="#F5F4ED">不可观察 · 模型与假设</text>

  <!-- ============= BOTTOM STRIP ============= -->
  <!-- 真题要点 -->
  <g filter="url(#soft)"><rect x="50" y="690" width="940" height="180" rx="12" fill="#FFFFFF"/></g>
  <text x="70" y="718" font-size="10" letter-spacing="2" font-weight="700" class="accent">EXAM CASE  ·  2022 多选 · 无形资产开发阶段成本构成</text>
  <text x="70" y="744" font-size="13" class="ink-soft">资本化条件至预定用途前，构成无形资产成本的支出有 ——</text>

  <rect x="70" y="760" width="210" height="92" rx="8" fill="#EDE8DD"/>
  <text x="84" y="782" font-size="12" font-weight="700" class="ink">A  ✓  专利权摊销</text>
  <text x="84" y="804" font-size="11" class="ink-soft">直接用于本开发活动</text>
  <text x="84" y="824" font-size="10" class="ink-mute">→ 直接归属</text>
  <text x="84" y="842" font-size="10" class="accent" font-weight="700">入账</text>

  <rect x="290" y="760" width="210" height="92" rx="8" fill="#F5F4ED"/>
  <text x="304" y="782" font-size="12" font-weight="700" class="ink-mute">B  ✗  使用培训支出</text>
  <text x="304" y="804" font-size="11" class="ink-mute">间接费用</text>
  <text x="304" y="824" font-size="10" class="ink-mute">→ 非必要</text>
  <text x="304" y="842" font-size="10" class="ink-mute" font-weight="700">费用化</text>

  <rect x="510" y="760" width="210" height="92" rx="8" fill="#EDE8DD"/>
  <text x="524" y="782" font-size="12" font-weight="700" class="ink">C  ✓  资本化利息</text>
  <text x="524" y="804" font-size="11" class="ink-soft">专门借款的利息</text>
  <text x="524" y="824" font-size="10" class="ink-mute">→ 直接归属 + 必要</text>
  <text x="524" y="842" font-size="10" class="accent" font-weight="700">入账</text>

  <rect x="730" y="760" width="240" height="92" rx="8" fill="#F5F4ED"/>
  <text x="744" y="782" font-size="12" font-weight="700" class="ink-mute">D  ✗  无法分配的共同支出</text>
  <text x="744" y="804" font-size="11" class="ink-mute">不能可靠计量</text>
  <text x="744" y="824" font-size="10" class="ink-mute">→ 不可直接归属</text>
  <text x="744" y="842" font-size="10" class="ink-mute" font-weight="700">费用化</text>

  <!-- 选择逻辑 -->
  <rect x="1010" y="690" width="540" height="180" rx="12" fill="#1F1E1B"/>
  <text x="1030" y="718" font-size="10" letter-spacing="2" font-weight="700" fill="#C96442">SELECTION LOGIC  ·  可靠性 ⇄ 相关性</text>
  <text x="1030" y="752" font-size="16" font-weight="700" fill="#F5F4ED">这是一道永恒的平衡题</text>

  <!-- two arrows -->
  <text x="1030" y="788" font-size="11" fill="#93918A">资产稳定 · 持有期长 · 市场不活跃</text>
  <text x="1030" y="810" font-size="14" font-weight="700" fill="#F5F4ED">→  历史成本</text>

  <line x1="1030" y1="822" x2="1530" y2="822" stroke="#3A3733"/>

  <text x="1030" y="844" font-size="11" fill="#93918A">市场活跃 · 透明 · 持有为短期套利</text>
  <text x="1030" y="864" font-size="14" font-weight="700" fill="#C96442">→  公允价值</text>

  <!-- footer meta -->
  <text x="50" y="888" font-size="9" letter-spacing="2" class="ink-mute">LIM  ·  逻辑重构 100 关  ·  Asset 01  ·  本质 / 确认 / 计量</text>
  <text x="1550" y="888" font-size="9" letter-spacing="2" class="ink-mute" text-anchor="end">2026</text>
</svg>
