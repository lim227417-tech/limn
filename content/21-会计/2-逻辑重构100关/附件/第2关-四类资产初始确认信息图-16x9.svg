<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Source Han Sans CN", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .ink { fill: #3D3833; }
      .ink-soft { fill: #5C5650; }
      .ink-mute { fill: #8E887F; }
      .accent { fill: #C96442; }
      .label { letter-spacing: 2.5px; font-weight: 700; }
    </style>
    <filter id="soft" x="-3%" y="-3%" width="106%" height="106%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#F5F4ED"/>

  <!-- ============= HEADER ============= -->
  <text x="50" y="42" font-size="13" class="ink-mute label">CPA · 会计 · 逻辑重构 100 关  /  ASSET 02</text>
  <text x="50" y="86" font-size="36" font-weight="700" class="ink">第 2 关 · 四类资产的初始确认</text>
  <text x="50" y="114" font-size="16" class="ink-soft">存货  ·  固定资产  ·  无形资产  ·  投资性房地产</text>
  <rect x="50" y="128" width="56" height="3" rx="1.5" fill="#C96442"/>

  <!-- top right thesis · 柔和暖深棕 -->
  <rect x="900" y="20" width="650" height="118" rx="14" fill="#3D3833"/>
  <text x="924" y="50" font-size="12" letter-spacing="3" font-weight="700" fill="#C96442">THESIS</text>
  <text x="924" y="78" font-size="16" fill="#D8D2C5">初始入账成本</text>
  <text x="924" y="106" font-size="20" font-weight="700" fill="#F5F4ED">= 让资产"能用"或"能卖"的全部直接必要代价</text>
  <text x="924" y="128" font-size="13" fill="#A8A095">第 1 关"成本边界"原则在四类资产上的具体落地</text>

  <!-- ============= SECTION A · 四类资产辨析 ============= -->
  <text x="50" y="172" font-size="13" class="accent label">A  /  辨析 · CLASSIFICATION</text>
  <text x="50" y="202" font-size="26" font-weight="700" class="ink">实质重于形式  ·  以"持有目的"为锚</text>
  <text x="50" y="224" font-size="14" class="ink-soft">同样一块土地，因持有目的不同，归入四个完全不同的科目</text>

  <!-- 4 type cards · w=364 gap=15, 150 tall -->
  <g filter="url(#soft)">
    <rect x="50"   y="244" width="364" height="150" rx="12" fill="#FFFFFF"/>
    <rect x="429"  y="244" width="364" height="150" rx="12" fill="#FFFFFF"/>
    <rect x="808"  y="244" width="364" height="150" rx="12" fill="#FFFFFF"/>
    <rect x="1187" y="244" width="363" height="150" rx="12" fill="#FFFFFF"/>
  </g>

  <!-- 存货 -->
  <rect x="50" y="244" width="6" height="150" rx="3" fill="#C96442"/>
  <text x="74" y="276" font-size="12" letter-spacing="2" font-weight="700" class="accent">INVENTORY</text>
  <text x="74" y="306" font-size="22" font-weight="700" class="ink">存货</text>
  <text x="74" y="332" font-size="14" class="ink-soft">持有目的  ·  出售</text>
  <text x="74" y="354" font-size="13" class="ink-mute">开发商待开发 / 在售土地</text>
  <line x1="74" y1="366" x2="100" y2="366" stroke="#E5E2D9"/>
  <text x="74" y="384" font-size="12" class="ink-mute">历史成本（可变现净值下限）</text>

  <!-- 固定资产 -->
  <rect x="429" y="244" width="6" height="150" rx="3" fill="#C96442" fill-opacity="0.85"/>
  <text x="453" y="276" font-size="12" letter-spacing="2" font-weight="700" class="accent">PP&amp;E</text>
  <text x="453" y="306" font-size="22" font-weight="700" class="ink">固定资产</text>
  <text x="453" y="332" font-size="14" class="ink-soft">持有目的  ·  自用 · 生产经营</text>
  <text x="453" y="354" font-size="13" class="ink-mute">工厂 / 总部大楼占用的土地</text>
  <line x1="453" y1="366" x2="479" y2="366" stroke="#E5E2D9"/>
  <text x="453" y="384" font-size="12" class="ink-mute">历史成本（可减值）</text>

  <!-- 无形资产 -->
  <rect x="808" y="244" width="6" height="150" rx="3" fill="#C96442" fill-opacity="0.7"/>
  <text x="832" y="276" font-size="12" letter-spacing="2" font-weight="700" class="accent">INTANGIBLE</text>
  <text x="832" y="306" font-size="22" font-weight="700" class="ink">无形资产</text>
  <text x="832" y="332" font-size="14" class="ink-soft">持有目的  ·  自用 · 非实物</text>
  <text x="832" y="354" font-size="13" class="ink-mute">单独计量的土地使用权</text>
  <line x1="832" y1="366" x2="858" y2="366" stroke="#E5E2D9"/>
  <text x="832" y="384" font-size="12" class="ink-mute">历史成本  ·  按年摊销</text>

  <!-- 投资性房地产 -->
  <rect x="1187" y="244" width="6" height="150" rx="3" fill="#C96442" fill-opacity="0.55"/>
  <text x="1211" y="276" font-size="12" letter-spacing="2" font-weight="700" class="accent">INVESTMENT PROPERTY</text>
  <text x="1211" y="306" font-size="22" font-weight="700" class="ink">投资性房地产</text>
  <text x="1211" y="332" font-size="14" class="ink-soft">持有目的  ·  租金 / 资本增值</text>
  <text x="1211" y="354" font-size="13" class="ink-mute">出租 / 持有待升值的土地</text>
  <line x1="1211" y1="366" x2="1237" y2="366" stroke="#E5E2D9"/>
  <text x="1211" y="384" font-size="12" class="ink-mute">历史成本  /  公允价值</text>

  <!-- 关键提示 -->
  <rect x="50" y="406" width="1500" height="36" rx="8" fill="#EDE8DD"/>
  <text x="68" y="430" font-size="13" class="ink-soft"><tspan font-weight="700" class="ink">混合用途按比例拆分</tspan>　·　开发商一栋楼一部分卖（存货）一部分出租（投资性房地产）　·　非房地产企业持有待增值土地 → 投资性房地产</text>

  <!-- ============= SECTION B · 采购取得 ============= -->
  <text x="50" y="478" font-size="13" class="accent label">B  /  采购取得 · ACQUISITION</text>
  <text x="50" y="508" font-size="26" font-weight="700" class="ink">通用公式  ·  六道判断</text>

  <!-- formula band -->
  <rect x="50" y="524" width="1500" height="42" rx="10" fill="#3D3833"/>
  <text x="70" y="552" font-size="15" fill="#F5F4ED">采购成本  =  <tspan font-weight="700" fill="#FFFFFF">购买价款</tspan>  +  相关税费  +  运输费  +  装卸费  +  保险费  +  <tspan fill="#E89B7E" font-weight="700">其他直接必要支出</tspan></text>

  <!-- 6 judgment cards · w=240 gap=12, 150 tall -->
  <g filter="url(#soft)">
    <rect x="50"   y="582" width="240" height="148" rx="10" fill="#FFFFFF"/>
    <rect x="302"  y="582" width="240" height="148" rx="10" fill="#FFFFFF"/>
    <rect x="554"  y="582" width="240" height="148" rx="10" fill="#FFFFFF"/>
    <rect x="806"  y="582" width="240" height="148" rx="10" fill="#FFFFFF"/>
    <rect x="1058" y="582" width="240" height="148" rx="10" fill="#FFFFFF"/>
    <rect x="1310" y="582" width="240" height="148" rx="10" fill="#FFFFFF"/>
  </g>

  <!-- card B1 · 税费 -->
  <text x="68" y="608" font-size="12" letter-spacing="2" font-weight="700" class="accent">① 税费</text>
  <text x="68" y="634" font-size="16" font-weight="700" class="ink">是不是最终承担者</text>
  <line x1="68" y1="648" x2="272" y2="648" stroke="#EAE7DD"/>
  <text x="68" y="670" font-size="13" class="ink-soft">增值税  ✗  不进成本</text>
  <text x="68" y="687" font-size="11" class="ink-mute">中转站，进项可抵扣</text>
  <text x="68" y="709" font-size="13" class="ink-soft">消费/关/资源税  ✓</text>
  <text x="68" y="725" font-size="11" class="ink-mute">无抵扣，真实承担代价</text>

  <!-- card B2 · 折扣 -->
  <text x="320" y="608" font-size="12" letter-spacing="2" font-weight="700" class="accent">② 折扣</text>
  <text x="320" y="634" font-size="16" font-weight="700" class="ink">商业 vs 现金</text>
  <line x1="320" y1="648" x2="524" y2="648" stroke="#EAE7DD"/>
  <text x="320" y="670" font-size="13" class="ink-soft">商业折扣  →  净价</text>
  <text x="320" y="687" font-size="11" class="ink-mute">购量优惠，发票直接扣</text>
  <text x="320" y="709" font-size="13" class="ink-soft">现金折扣  →  总价</text>
  <text x="320" y="725" font-size="11" class="ink-mute">融资收益，冲减财务费用</text>

  <!-- card B3 · 安装/培训 -->
  <text x="572" y="608" font-size="12" letter-spacing="2" font-weight="700" class="accent">③ 直接代价</text>
  <text x="572" y="634" font-size="16" font-weight="700" class="ink">机器 vs 人</text>
  <line x1="572" y1="648" x2="776" y2="648" stroke="#EAE7DD"/>
  <text x="572" y="670" font-size="13" class="ink-soft">安装调试  ✓  进成本</text>
  <text x="572" y="687" font-size="11" class="ink-mute">让机器达可使用状态</text>
  <text x="572" y="709" font-size="13" class="ink-soft">培训费  ✗  管理费用</text>
  <text x="572" y="725" font-size="11" class="ink-mute">提升人的能力，非资产</text>

  <!-- card B4 · 试运行产出品 -->
  <text x="824" y="608" font-size="12" letter-spacing="2" font-weight="700" class="accent">④ 试运行</text>
  <text x="824" y="634" font-size="16" font-weight="700" class="ink">不冲减资产成本</text>
  <line x1="824" y1="648" x2="1028" y2="648" stroke="#EAE7DD"/>
  <text x="824" y="670" font-size="13" class="ink-soft">产出品  →  单独存货</text>
  <text x="824" y="687" font-size="11" class="ink-mute">售出时正常确认收益</text>
  <text x="824" y="709" font-size="13" class="ink-soft">防操纵考量</text>
  <text x="824" y="725" font-size="11" class="ink-mute">否则人为延长试运行</text>

  <!-- card B5 · 弃置费用 -->
  <text x="1076" y="608" font-size="12" letter-spacing="2" font-weight="700" class="accent">⑤ 弃置费用</text>
  <text x="1076" y="634" font-size="16" font-weight="700" class="ink">现在就要认</text>
  <line x1="1076" y1="648" x2="1280" y2="648" stroke="#EAE7DD"/>
  <text x="1076" y="670" font-size="13" class="ink-soft">现值进资产成本</text>
  <text x="1076" y="687" font-size="11" class="ink-mute">同时确认预计负债</text>
  <text x="1076" y="709" font-size="13" class="ink-soft">核电站 · 油气井</text>
  <text x="1076" y="725" font-size="11" class="ink-mute">全生命周期成本一部分</text>

  <!-- card B6 · 含融资成分 -->
  <text x="1328" y="608" font-size="12" letter-spacing="2" font-weight="700" class="accent">⑥ 分期付款</text>
  <text x="1328" y="634" font-size="16" font-weight="700" class="ink">按现值入账</text>
  <line x1="1328" y1="648" x2="1532" y2="648" stroke="#EAE7DD"/>
  <text x="1328" y="670" font-size="13" class="ink-soft">资产 = 各期现值之和</text>
  <text x="1328" y="687" font-size="11" class="ink-mute">差额 → 未确认融资费用</text>
  <text x="1328" y="709" font-size="13" class="ink-soft">实际利率法摊销</text>
  <text x="1328" y="725" font-size="11" class="ink-mute">符合条件可资本化</text>

  <!-- ============= SECTION C · 自建取得 ============= -->
  <text x="50" y="762" font-size="13" class="accent label">C  /  自建取得 · CONSTRUCTION  &amp;  R&amp;D</text>

  <g filter="url(#soft)">
    <rect x="50"   y="780" width="360" height="100" rx="12" fill="#FFFFFF"/>
    <rect x="425"  y="780" width="360" height="100" rx="12" fill="#FFFFFF"/>
    <rect x="800"  y="780" width="750" height="100" rx="12" fill="#FFFFFF"/>
  </g>

  <!-- 存货自建 -->
  <text x="68" y="806" font-size="14" font-weight="700" class="ink">存货自建</text>
  <line x1="68" y1="818" x2="392" y2="818" stroke="#EAE7DD"/>
  <text x="68" y="840" font-size="13" class="ink-soft">直接材料 + 直接人工 + 制造费用</text>
  <text x="68" y="862" font-size="11" class="ink-mute">含必要停工损失（季节性 / 完成必需）</text>

  <!-- 在建工程 -->
  <text x="443" y="806" font-size="14" font-weight="700" class="ink">在建工程  →  固定资产</text>
  <line x1="443" y1="818" x2="767" y2="818" stroke="#EAE7DD"/>
  <text x="443" y="840" font-size="13" class="ink-soft">直接相关支出 + 符合条件的借款费用资本化</text>
  <text x="443" y="862" font-size="11" class="ink-mute">达到预定可使用状态前资本化，之后费用化</text>

  <!-- 研发支出 -->
  <text x="818" y="806" font-size="14" font-weight="700" class="ink">研发支出  →  无形资产</text>
  <line x1="818" y1="818" x2="1532" y2="818" stroke="#EAE7DD"/>
  <text x="818" y="840" font-size="13" class="ink-soft"><tspan class="accent" font-weight="700">研究阶段 全部费用化</tspan>　·　<tspan class="accent" font-weight="700">开发阶段 满足 5 条件方可资本化</tspan></text>
  <text x="818" y="862" font-size="11" class="ink-mute">① 技术可行  ② 完成意图  ③ 经济利益可证明  ④ 资源支持  ⑤ 支出可靠计量　·　无法区分阶段 → 全按研究 ·  已费用化不得追溯</text>

</svg>
